<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100c0d"><meta name="apple-mobile-web-app-capable" content="yes">
<title>César & Vanessa — Menú</title>
<style>
:root{--black:#100c0d;--wine:#5b1523;--wine2:#3d0d17;--gold:#c7a45f;--cream:#f0e4cf;--ink:#251a16}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070607;color:var(--cream);font-family:Georgia,"Times New Roman",serif}body{display:flex;justify-content:center}button{font:inherit}
#app{width:min(100%,560px);padding:14px}.frame{min-height:calc(100vh - 28px);position:relative;overflow:hidden;border:1px solid #765b2e;background:radial-gradient(circle at 50% 25%,#32131b 0,#110b0d 38%,#050505 100%)}.frame:before{content:"";position:absolute;inset:7px;border:1px solid #8b6b37;opacity:.65;pointer-events:none}
.screen{display:none;position:relative;padding:30px 22px 34px}.screen.active{display:block}.cover{min-height:calc(100vh - 90px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.kicker,.hint,.footer{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#bca98c}.crest{width:92px;height:92px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:27px;margin:22px 0 8px;position:relative}.crest:before,.crest:after{content:"✦";position:absolute;color:var(--gold);font-size:14px}.crest:before{left:-10px}.crest:after{right:-10px}
h1{font-size:clamp(35px,11vw,58px);font-weight:400;letter-spacing:.12em;margin:10px 0}.amp{color:var(--gold);font-style:italic}.date{font-size:13px;letter-spacing:.34em;color:var(--gold)}.tagline{font-style:italic;color:#d0c1a8;margin-top:20px}.seal{margin-top:40px;width:84px;height:84px;border-radius:50%;border:2px solid #a96c46;background:radial-gradient(circle at 35% 28%,#8c2b3d,#430f1b 72%);color:#f0cb7e;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 22px #000}.seal span{font-size:11px;letter-spacing:.08em}.hint{margin-top:13px}
.book{background:linear-gradient(90deg,#211719,#f1e4ca 8%,#f7edd9 92%,#211719);color:var(--ink);padding:18px;border:1px solid #a98449;box-shadow:0 18px 50px #000}.paper{min-height:70vh;border:1px solid #9e7a43;padding:25px 17px;background:radial-gradient(circle at 50% 0,#fff8e9,#e7d8bd)}.menu-mark{text-align:center;color:#7b5929;font-size:18px}.menu-title{text-align:center;font-weight:400;letter-spacing:.30em;font-size:28px;margin:5px 0 24px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:20px}.tab{min-height:45px;border:1px solid #b59663;background:#eadfc9;color:#503b22;cursor:pointer;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.tab.active{background:var(--wine2);color:#f5e6c4;border-color:var(--wine2)}.section-title{text-align:center;letter-spacing:.24em;text-transform:uppercase;font-size:15px;color:#684a22;margin:15px 0 18px}.item{text-align:center;padding:13px 3px;border-bottom:1px solid rgba(104,74,34,.25);font-size:17px;line-height:1.35}.item:last-child{border-bottom:0}.close{display:block;margin:24px auto 0;background:var(--wine2);color:#f4e5c5;border:0;padding:12px 20px;min-height:45px;cursor:pointer;letter-spacing:.12em;text-transform:uppercase;font-size:11px}.footer{text-align:center;margin-top:19px}
@media(prefers-reduced-motion:no-preference){.seal{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.04)}}}
</style></head>
<body><main id="app"><div class="frame">
<section id="cover" class="screen active cover"><div class="kicker">La celebración de nuestro amor</div><div class="crest">C&amp;V</div><h1>CÉSAR <span class="amp">&amp;</span> VANESSA</h1><div class="date">03 · 10 · 2026</div><div class="tagline">Una noche fuera del tiempo</div><button class="seal" id="open" aria-label="Abrir menú"><span>ABRIR<br>MENÚ</span></button><div class="hint">Toca el sello para descubrir</div></section>
<section id="menu" class="screen"><div class="book"><div class="paper"><div class="menu-mark">✦</div><h2 class="menu-title">MENÚ</h2><div class="tabs" role="tablist"><button class="tab active" data-tab="entrada">Entrada</button><button class="tab" data-tab="principal">Plato fuerte</button><button class="tab" data-tab="bebidas">Bebidas</button></div><div id="content" aria-live="polite"></div><button class="close" id="back">Cerrar menú</button></div></div><div class="footer">César &amp; Vanessa · 03 · 10 · 2026</div></section>
</div></main>
<script>
const data={entrada:["Ensalada César's"],principal:["Pasta Alfredo","Pasta al Chipotle","Lasagna de Ternera","Milanesa","Pechuga de Pollo a la Cordon Bleu"],bebidas:["Sangría","Cerveza Roja & Light","Paloma","Vodka con Jugo de Piña","Vodka con Jugo de Arándano","Soda (Coca-Cola & Squirt)","Agua"]};const titles={entrada:"Entrada",principal:"Plato fuerte",bebidas:"Bebidas"};const content=document.querySelector('#content');
function render(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));content.innerHTML='<div class="section-title">'+titles[tab]+'</div>'+data[tab].map(x=>'<div class="item">'+x+'</div>').join('')}
document.querySelector('#open').onclick=()=>{document.querySelector('#cover').classList.remove('active');document.querySelector('#menu').classList.add('active');render('entrada');scrollTo({top:0,behavior:'smooth'})};document.querySelector('#back').onclick=()=>{document.querySelector('#menu').classList.remove('active');document.querySelector('#cover').classList.add('active');scrollTo({top:0,behavior:'smooth'})};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));render('entrada');
</script></body></html>
